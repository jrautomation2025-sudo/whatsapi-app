<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definição de Cores e Degradês -->
  <defs>
    <!-- Degradê de fundo (Azul Escuro / Noturno) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Degradê Principal (Azul Vibrante / Ciano) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Degradê de Destaque (Verde Tech) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Detalhes de Circuito/Tecnologia de Fundo -->
  <circle cx="100" cy="120" r="8" fill="url(#primaryGrad)" />
  <path d="M 100 120 L 100 80 L 412 80" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.2"/>
  <circle cx="412" cy="392" r="8" fill="url(#accentGrad)" />
  <path d="M 412 392 L 412 432 L 100 432" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.2"/>

  <!-- Iniciais "JR" centralizadas -->
  <text 
    x="256" 
    y="280" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="170" 
    font-weight="900" 
    fill="url(#primaryGrad)" 
    text-anchor="middle" 
    letter-spacing="-8">
    JR
  </text>

  <!-- Linha de Separação -->
  <rect x="156" y="310" width="200" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Texto "TEC" Alinhado à Direita -->
  <text 
    x="366" 
    y="390" 
    font-family="monospace, 'Courier New', Courier, sans-serif" 
    font-size="65" 
    font-weight="bold" 
    fill="#f8fafc" 
    text-anchor="end" 
    letter-spacing="10">
    TEC
  </text>
</svg>
